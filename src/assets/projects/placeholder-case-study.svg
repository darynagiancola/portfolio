  <rect width="1600" height="1000" fill="url(#bg)" />
  <rect x="150" y="120" width="1300" height="760" rx="40" fill="#fbf8f1" stroke="#d6cfbf" stroke-width="4" />
  <text x="50%" y="45%" text-anchor="middle" fill="#4b5447" font-size="64" font-family="Inter, sans-serif" letter-spacing="5">CASE STUDY</text>
  <text x="50%" y="54%" text-anchor="middle" fill="#6f786d" font-size="42" font-family="Inter, sans-serif" letter-spacing="2">in progress</text>
  <text x="50%" y="63%" text-anchor="middle" fill="#8a8f87" font-size="24" font-family="Inter, sans-serif">replace with final project imagery</text>
