<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Case study placeholder</title>
  <desc id="desc">Temporary image placeholder for a future portfolio case study.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f4ec" />
      <stop offset="100%" stop-color="#efe8db" />
    </linearGradient>
